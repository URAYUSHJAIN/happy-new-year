<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy New Year 2026! 🎉</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="fireworks"></div>
        <div class="content">
            <h1 class="title">Happy New Year!</h1>
            <div class="year">2026</div>
            <p class="message">Wishing you joy, success, and endless possibilities!</p>
            <div class="wishes">
                <div class="wish">✨ New Beginnings</div>
                <div class="wish">🌟 Bright Future</div>
                <div class="wish">💫 Dreams Come True</div>
                <div class="wish">🎊 Joy & Happiness</div>
            </div>
            <button class="celebrate-btn" onclick="celebrate()">Celebrate! 🎉</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
